<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch TV Shows Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { netflixRed: '#E50914', netflixDark: '#141414' } } }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black">
    <!-- Hero Section -->
    <div class="relative w-full h-[100vh] min-h-[700px] border-b-8 border-[#232323] overflow-hidden">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img src="https://assets.nflxext.com/ffe/siteui/vlv3/9d3533b2-0e2b-40b2-95e0-eca797977fa2/f9630cce-7da3-4bf0-b186-b4bcba4c6e91/IN-en-20240311-popsignuptwoweeks-perspective_alpha_website_large.jpg" class="w-full h-full object-cover opacity-60" alt="bg">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black opacity-90"></div>
        </div>

        <!-- Navbar -->
        <nav class="relative z-10 flex items-center justify-between px-6 md:px-36 py-6 max-w-[1920px] mx-auto">
            <svg class="w-32 md:w-44 text-netflixRed fill-current" viewBox="0 0 111 30"><path d="M105.062 14.28L111 30C104.062 28.2 97.125 26.4 90.187 24.6L94.5 13.92L88.937 0H96.437L99.75 8.7L103.312 0H111L105.062 14.28ZM77.25 21.48C81.375 22.14 85.312 22.86 89.25 23.64L87.562 30C80.625 28.56 73.687 27.24 66.75 26.1L69 0H76.312L77.25 21.48ZM63 25.5C56.062 24.48 49.312 23.58 42.562 22.8L44.25 0H51.562L50.25 18.06C54.375 18.54 58.5 19.08 62.625 19.68L63 25.5ZM37.687 22.26L35.812 30C29.062 29.28 22.125 28.68 15.187 28.14L15.375 22.14C19.312 22.38 23.25 22.68 27.187 23.04L27.75 14.46C24 14.22 20.25 14.04 16.5 13.86L16.875 8.04C20.625 8.16 24.375 8.28 28.125 8.46L28.687 0H36.187L35.25 8.7C39 9 42.75 9.36 46.5 9.78L46.125 15.6C42.375 15.24 38.625 14.88 34.875 14.58L34.125 23.04C35.312 23.1 36.5 23.16 37.687 22.26ZM15 28.14L7.5 27.72V0H15V28.14ZM0 27.42L7.312 11.22L7.687 27.66C5.062 27.6 2.5 27.54 0 27.42ZM2.062 0H8.812L14.437 14.34L14.25 0H21.375V30L15.187 30L8.25 13.08L8.062 30H0V0H2.062Z"/></svg>
            <div class="flex gap-4">
                <a href="login.html" class="bg-netflixRed hover:bg-red-700 text-white font-medium px-4 py-1.5 rounded text-sm md:text-base transition">Sign In</a>
            </div>
        </nav>

        <!-- Hero Content -->
        <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-4 -mt-20">
            <h1 class="text-4xl md:text-[3.5rem] font-black text-white leading-tight mb-4 max-w-4xl">Unlimited movies, TV shows and more</h1>
            <p class="text-xl md:text-2xl text-white font-medium mb-6">Watch anywhere. Cancel anytime.</p>
            
            <form id="signup-form" class="w-full max-w-3xl mt-4">
                <p class="text-white text-lg mb-4">Ready to watch? Enter your email to create or restart your membership.</p>
                <div class="flex flex-col md:flex-row gap-2">
                    <div class="relative flex-1">
                        <input type="email" id="email" required class="peer w-full h-14 bg-black/50 border border-gray-400 rounded px-4 pt-4 text-white focus:outline-none focus:ring-2 focus:ring-white focus:border-transparent placeholder-transparent" placeholder="Email address">
                        <label for="email" class="floating-label absolute left-4 top-4 text-gray-400 text-base peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-1 peer-focus:text-xs peer-valid:top-1 peer-valid:text-xs pointer-events-none">Email address</label>
                    </div>
                    <a href="signup.html" class="bg-netflixRed hover:bg-red-700 text-white text-xl md:text-2xl font-bold px-8 h-14 rounded flex items-center justify-center gap-2 transition">
                        Get Started <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-black border-t border-[#232323] px-6 py-12 md:px-16 lg:px-24">
        <div class="mx-auto max-w-7xl text-sm text-gray-400">
            <p class="mb-6">Questions? Call 000-800-919-1694</p>
            <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                <a href="#" class="hover:text-white">FAQ</a>
                <a href="#" class="hover:text-white">Help Centre</a>
                <a href="#" class="hover:text-white">Terms of Use</a>
                <a href="#" class="hover:text-white">Privacy</a>
                <a href="#" class="hover:text-white">Cookie Preferences</a>
                <a href="#" class="hover:text-white">Corporate Information</a>
                <a href="#" class="hover:text-white">Account</a>
                <a href="#" class="hover:text-white">Media Centre</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
</body>
</html>
