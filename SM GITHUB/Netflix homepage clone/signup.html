<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { netflixRed: '#E50914' } } } }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-[#141414] text-white">
    <div class="min-h-screen bg-[url('https://assets.nflxext.com/ffe/siteui/vlv3/9d3533b2-0e2b-40b2-95e0-eca797977fa2/f9630cce-7da3-4bf0-b186-b4bcba4c6e91/IN-en-20240311-popsignuptwoweeks-perspective_alpha_website_large.jpg')] bg-cover bg-center">
        <div class="min-h-screen bg-black/70">
            <header class="px-4 py-4 md:px-8">
                <a href="index.html">
                    <svg class="w-32 text-netflixRed fill-current" viewBox="0 0 111 30"><path d="M105.062 14.28L111 30C104.062 28.2 97.125 26.4 90.187 24.6L94.5 13.92L88.937 0H96.437L99.75 8.7L103.312 0H111L105.062 14.28ZM77.25 21.48C81.375 22.14 85.312 22.86 89.25 23.64L87.562 30C80.625 28.56 73.687 27.24 66.75 26.1L69 0H76.312L77.25 21.48ZM63 25.5C56.062 24.48 49.312 23.58 42.562 22.8L44.25 0H51.562L50.25 18.06C54.375 18.54 58.5 19.08 62.625 19.68L63 25.5ZM37.687 22.26L35.812 30C29.062 29.28 22.125 28.68 15.187 28.14L15.375 22.14C19.312 22.38 23.25 22.68 27.187 23.04L27.75 14.46C24 14.22 20.25 14.04 16.5 13.86L16.875 8.04C20.625 8.16 24.375 8.28 28.125 8.46L28.687 0H36.187L35.25 8.7C39 9 42.75 9.36 46.5 9.78L46.125 15.6C42.375 15.24 38.625 14.88 34.875 14.58L34.125 23.04C35.312 23.1 36.5 23.16 37.687 22.26ZM15 28.14L7.5 27.72V0H15V28.14ZM0 27.42L7.312 11.22L7.687 27.66C5.062 27.6 2.5 27.54 0 27.42ZM2.062 0H8.812L14.437 14.34L14.25 0H21.375V30L15.187 30L8.25 13.08L8.062 30H0V0H2.062Z"></path></svg>
                </a>
            </header>

            <main class="flex items-center justify-center px-4 py-8 md:py-12">
                <div class="w-full max-w-[440px] rounded-xl bg-black/80 p-8 md:p-10 shadow-2xl">
                    <p class="text-sm uppercase tracking-[0.25em] text-[#e50914] font-semibold">Step 1 of 3</p>
                    <h1 class="mt-3 text-3xl font-bold">Create your account</h1>
                    <p class="mt-2 text-sm text-gray-400">Join Netflix for unlimited movies, TV shows, and more.</p>

                    <form id="signup-form" class="mt-6 space-y-4">
                        <div class="relative">
                            <input type="email" id="email" required class="peer w-full h-[50px] bg-[#333] rounded px-4 pt-3 text-white focus:outline-none focus:bg-[#454545] placeholder-transparent" placeholder="Email address">
                            <label class="floating-label absolute left-4 top-3.5 text-gray-400 text-sm peer-placeholder-shown:text-base peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-[11px] peer-valid:top-1 peer-valid:text-[11px] pointer-events-none">Email address</label>
                        </div>
                        <div class="relative">
                            <input type="password" id="password" required minlength="4" class="peer w-full h-[50px] bg-[#333] rounded px-4 pt-3 text-white focus:outline-none focus:bg-[#454545] placeholder-transparent" placeholder="Password">
                            <label class="floating-label absolute left-4 top-3.5 text-gray-400 text-sm peer-placeholder-shown:text-base peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-[11px] peer-valid:top-1 peer-valid:text-[11px] pointer-events-none">Create password</label>
                        </div>
                        <button type="submit" class="w-full rounded bg-netflixRed py-3 font-semibold transition hover:bg-red-700">Continue</button>
                    </form>

                    <p class="mt-6 text-sm text-gray-400">
                        Already have an account? <a href="login.html" class="text-white hover:underline">Sign in</a>
                    </p>
                </div>
            </main>
        </div>
    </div>

    <footer class="border-t border-gray-800 bg-black/80 px-6 py-8 text-sm text-gray-400">
        <div class="mx-auto flex max-w-5xl flex-col gap-4 md:flex-row md:justify-between">
            <p>Questions? Call 000-800-919-1694</p>
            <div class="flex flex-wrap gap-4">
                <a href="#" class="hover:text-white">FAQ</a>
                <a href="#" class="hover:text-white">Help Centre</a>
                <a href="#" class="hover:text-white">Terms of Use</a>
                <a href="#" class="hover:text-white">Privacy</a>
            </div>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const created = registerUser(email, password);
            if (created) {
                window.location.href = 'plan.html';
            }
        });
    </script>
</body>
</html>
