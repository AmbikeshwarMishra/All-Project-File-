<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🍳 Gourmet Finder</div>
        <nav>
            <button id="nav-home" class="active">Home</button>
            <button id="nav-favorites">Favorites</button>
            <button id="btn-surprise">🎲 Surprise Me</button>
        </nav>
    </header>

    <main>
        <!-- Search & Filter Controls Section -->
        <section id="controls-section">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for a recipe (e.g., Chicken)...">
                <button id="search-btn">Search</button>
            </div>
            <div class="filter-container">
                <select id="filter-category"><option value="">All Categories</option></select>
                <select id="filter-area"><option value="">All Cuisines</option></select>
            </div>
        </section>

        <!-- Dynamic Content Section -->
        <h2 id="section-title">Latest Discoveries</h2>
        <div id="recipe-grid" class="recipe-grid"></div>
    </main>

    <!-- Modal for Detailed View -->
    <div id="recipe-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
